server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Permalinks indexed from the previous WordPress site.
    location = /adhesivo-de-contacto/ { return 301 /productos/adhesivo-de-contacto-pegalo/; }
    location = /sellador-de-silicona-acetica/ { return 301 /productos/sellador-acetico-pegalo/; }
    location = /artesanato-lubricante-en-aerosol/ { return 301 /productos/lubricante-pegalo/; }
    location = /poliuretano-628-automotor/ { return 301 /productos/poliuretano-628-automotor/; }
    location = /barras-hot-melt/ { return 301 /productos/barras-adhesivas-hot-melt/; }
    location = /crema-para-bachas-blanca-y-acero/ { return 301 /productos/crema-para-bachas-blanca-y-acero/; }
    location = /sellador-alta-temperatura/ { return 301 /productos/sellador-alta-temperatura/; }
    location = /sellador-de-roscas/ { return 301 /productos/sellador-de-roscas/; }
    location = /pistola-aplicadora-de-hot-melt/ { return 301 /productos/pistola-aplicadora-de-hot-melt/; }
    location = /cola-vinilica-pegalo/ { return 301 /productos/cola-vinilica-pegalo/; }
    location = /cianocrilato-pegalo/ { return 301 /productos/cianoacrilato-pegalo/; }
    location = /silicona-liquida/ { return 301 /productos/silicona-liquida/; }
    location = /sellador-zingueria/ { return 301 /productos/sellador-para-zingueria/; }
    location = /poliuretano-construccion-industria/ { return 301 /productos/poliuretano-construccion-industria/; }
    location = /silicona-neutra/ { return 301 /productos/silicona-neutra/; }
    location = /sellador-acetico-pegalo/ { return 301 /productos/sellador-acetico-pegalo/; }
    location = /sellador-acrilico/ { return 301 /productos/sellador-acrilico/; }
    location = /espuma-de-poliuretano/ { return 301 /productos/espuma-de-poliuretano/; }
    location = /pistola-aplicadora/ { return 301 /productos/pistola-aplicadora/; }
    location = /cinta-teflon/ { return 301 /productos/cinta-teflon/; }
    location = /silicona-acetica-artesanato/ { return 301 /productos/silicona-acetica-artesanato/; }

    location = /productos/ { return 301 /#catalogo; }
    location = /empresa/ { return 301 /#empresa; }
    location = /donde-atendemos/ { return 301 /#donde-atendemos; }
    location = /contacto/ { return 301 /#contacto; }
    location = /linea-pegalo/ { return 301 /#catalogo; }
    location = /linea-artesanato/ { return 301 /#catalogo; }
    location = /linea-instalador/ { return 301 /#catalogo; }
    location = /precios/ { return 301 /#contacto; }
    location = /informacion-lista/ { return 301 /#descargas; }
    location = /category/linea-pegalo/ { return 301 /#catalogo; }
    location = /category/linea-artesanato/ { return 301 /#catalogo; }
    location = /category/linea-instalador/ { return 301 /#catalogo; }
    location = /category/ { return 301 /#catalogo; }

    location ^~ /wp-admin { return 301 /; }
    location ^~ /wp-login { return 301 /; }
    location ^~ /wp-json { return 301 /; }
    location ^~ /author/ { return 301 /; }
    location = /feed/ { return 301 /; }
    location = /comments/feed/ { return 301 /; }

    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
